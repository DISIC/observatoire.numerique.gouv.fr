version: '3.4'

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: observatoire
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

  # Ancienne base, uniquement pour tester la migration des données : docker compose --profile migration up
  mongo:
    profiles: ['migration']
    build: ./mongodb_replica
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_REPLICA_HOST: localhost
      MONGO_REPLICA_PORT: 27018
    ports:
      - '27018:27018'
    volumes:
      - mongo-data:/data/db

  maildev:
    image: maildev/maildev
    ports:
      - '1080:1080'
      - '1025:1025'

volumes:
  postgres-data:
  mongo-data:
